name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # coverlet's default per-hit counter increment is a ~4x tax on the composition search's hot loops; SingleHit
  # records each sequence point once and reports identical line and branch coverage.
  COVERLET: --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.SingleHit=true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: 🔨 set up .net
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    # Coverage-bearing runs build Debug so the coverable-line basis Codecov reports is unchanged (Release collapses
    # ~17 % of the sequence points and moves the percentage by +0.09 pt; measured on this branch). Architecture.Tests
    # carries no coverage and builds Release. The Library suite runs its fixtures in parallel
    # (tests/BaroquenMelody.Library.Tests/AssemblyInfo.cs).
    - name: 🧪 run tests
      run: |
        dotnet test tests/BaroquenMelody.Library.Tests/ -c Debug --logger trx --results-directory TestResults/library ${{ env.COVERLET }}
        dotnet test tests/BaroquenMelody.Infrastructure.Tests/ -c Debug --logger trx --results-directory TestResults/infrastructure ${{ env.COVERLET }}
        dotnet test tests/BaroquenMelody.App.Components.Tests/ -c Debug --logger trx --results-directory TestResults/components ${{ env.COVERLET }}
        dotnet test tests/BaroquenMelody.Architecture.Tests/ -c Release --logger trx --results-directory TestResults/architecture

    - name: 💌 publish code coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/library/**/coverage.opencover.xml,TestResults/infrastructure/**/coverage.opencover.xml,TestResults/components/**/coverage.opencover.xml
        fail_ci_if_error: true

    - name: 📦 upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: TestResults/**/*.trx
        if-no-files-found: ignore
