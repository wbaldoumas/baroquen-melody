name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: 🔨 set up .net
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: 🧪 run tests
      run: |
        cd ./tests/BaroquenMelody.Library.Tests/
        dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        cp TestResults/*/coverage.opencover.xml .

        cd ../BaroquenMelody.Infrastructure.Tests/
        dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        cp TestResults/*/coverage.opencover.xml .

        cd ../BaroquenMelody.App.Components.Tests/
        dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        cp TestResults/*/coverage.opencover.xml .

        cd ../BaroquenMelody.Architecture.Tests/
        dotnet test

    - name: 💌 publish code coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: /home/runner/work/baroquen-melody/baroquen-melody/tests/BaroquenMelody.Library.Tests/coverage.opencover.xml,/home/runner/work/baroquen-melody/baroquen-melody/tests/BaroquenMelody.Infrastructure.Tests/coverage.opencover.xml,/home/runner/work/baroquen-melody/baroquen-melody/tests/BaroquenMelody.App.Components.Tests/coverage.opencover.xml
        fail_ci_if_error: true
