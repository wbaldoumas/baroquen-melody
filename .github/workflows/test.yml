name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - BaroquenMelody.Library.Tests
          - BaroquenMelody.Infrastructure.Tests
          - BaroquenMelody.App.Components.Tests
    steps:
    - uses: actions/checkout@v7

    - name: 🔨 set up .net
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: 🧪 run tests
      run: |
        cd ./tests/${{ matrix.project }}/
        dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        cp TestResults/*/coverage.opencover.xml .

    - name: 💌 publish code coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: tests/${{ matrix.project }}/coverage.opencover.xml
        fail_ci_if_error: true
